server:
  port: ${PORT:8081}

spring:
  application:
    name: users-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/usersdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: ${SHOW_SQL:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework: ${SPRING_LOG_LEVEL:INFO}
    com.ganado: ${APP_LOG_LEVEL:INFO}

gateway:
  url: ${GATEWAY_URL:http://localhost:8080}
  internal:
    secret: ${INTERNAL_GATEWAY_SECRET:Ganado360InternalSecretKey2026}
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
