server:
  port: ${PORT:8084}

spring:
  application:
    name: reproduccion

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reproducciondb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: ${SHOW_SQL:false}

logging:
  level:
    org.springframework: ${SPRING_LOG_LEVEL:INFO}
    com.ganado: ${APP_LOG_LEVEL:INFO}

gateway:
  internal:
    secret: ${INTERNAL_GATEWAY_SECRET:Ganado360InternalSecretKey2026}
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
